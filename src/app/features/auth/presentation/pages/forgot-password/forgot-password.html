<app-auth-layout>
  <app-form-card
    title="Recuperar acesso"
    subtitle="Informe seu e-mail para receber as próximas instruções"
  >
    @if (errorMessage(); as message) {
      <eyes-feedback-banner
        tone="error"
        title="Não foi possível solicitar a recuperação"
        [message]="message"
      />
    }

    <div *ngIf="isSubmitted()" class="completion-panel" role="status" aria-live="polite">
      <h2>Confira seu e-mail</h2>
      <p>
        Se existir uma conta ativa para o endereço informado, enviaremos um link de recuperação.
        Verifique também a caixa de spam.
      </p>
      <a class="auth-link-button auth-link-button--secondary" routerLink="/login">
        Voltar para o login
      </a>
    </div>

    <form
      *ngIf="!isSubmitted()"
      [formGroup]="forgotForm"
      (ngSubmit)="onSubmit()"
      class="public-form"
      novalidate
    >
      <div class="form-group" [class.invalid]="isEmailInvalid()">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="seu@email.com"
            autocomplete="email"
            inputmode="email"
            [attr.aria-invalid]="isEmailInvalid()"
            [attr.aria-describedby]="isEmailInvalid() ? 'forgot-email-error' : null"
          />
        </div>
        <small id="forgot-email-error" class="error-msg" *ngIf="isEmailInvalid()">
          Informe um e-mail válido.
        </small>
      </div>

      <div class="form-actions">
        <app-button
          variant="primary"
          label="Enviar instruções"
          type="submit"
          [fullWidth]="true"
          [loading]="isLoading()"
          [disabled]="forgotForm.invalid || isLoading()"
        />
      </div>

      <div class="footer-links">
        <a routerLink="/login">Voltar para o login</a>
      </div>
    </form>
  </app-form-card>
</app-auth-layout>
