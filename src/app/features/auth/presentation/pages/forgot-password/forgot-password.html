<app-auth-layout>
  <app-form-card title="Recuperar Senha" subtitle="Insira seu e-mail para receber as instruções de recuperação">
    
    <div *ngIf="isSubmitted()" class="success-container">
      <div class="success-icon">✓</div>
      <p>Um e-mail com o link de recuperação foi enviado para <strong>{{ forgotForm.value.email }}</strong>.</p>
      <p class="hint">Se não encontrar, verifique sua caixa de spam.</p>
      
      <app-button 
        variant="secondary" 
        label="Voltar para o Login" 
        routerLink="/login">
      </app-button>
    </div>

    <form *ngIf="!isSubmitted()" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="seu@email.com">
        </div>
      </div>

      <app-button 
        variant="primary" 
        label="Enviar Link de Recuperação" 
        type="submit"
        [loading]="authFacade.isLoading()"
        [disabled]="forgotForm.invalid">
      </app-button>

      <div class="footer-links">
        <a routerLink="/login">Voltar para o Login</a>
      </div>
    </form>

  </app-form-card>
</app-auth-layout>
