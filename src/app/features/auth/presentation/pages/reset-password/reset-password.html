<app-auth-layout>
  <app-form-card title="Nova Senha" subtitle="Crie uma nova senha para voltar a acessar o sistema">
    
    <div *ngIf="isSuccess()" class="success-container">
      <div class="success-icon">✓</div>
      <p>Sua senha foi redefinida com sucesso.</p>
      
      <app-button 
        variant="primary" 
        label="Ir para o Login" 
        routerLink="/login">
      </app-button>
    </div>

    <form *ngIf="!isSuccess()" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
      
      <div class="form-group" [class.invalid]="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
        <label for="password">Nova Senha</label>
        <div class="input-wrapper">
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="Mínimo 6 caracteres">
        </div>
        <small class="error-msg" *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
          Senha deve ter no mínimo 6 caracteres
        </small>
      </div>

      <div class="form-group" [class.invalid]="resetForm.get('confirmPassword')?.touched && (resetForm.get('confirmPassword')?.invalid || resetForm.value.password !== resetForm.value.confirmPassword)">
        <label for="confirmPassword">Confirmar Nova Senha</label>
        <div class="input-wrapper">
          <input 
            id="confirmPassword" 
            type="password" 
            formControlName="confirmPassword" 
            placeholder="Repita a nova senha">
        </div>
        <small class="error-msg" *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.value.password !== resetForm.value.confirmPassword">
          As senhas não coincidem
        </small>
      </div>

      <app-button 
        variant="primary" 
        label="Redefinir Senha" 
        type="submit"
        [loading]="authFacade.isLoading()"
        [disabled]="resetForm.invalid || resetForm.value.password !== resetForm.value.confirmPassword">
      </app-button>

      <div class="footer-links">
        <a routerLink="/login">Cancelar e Voltar</a>
      </div>
    </form>

  </app-form-card>
</app-auth-layout>
