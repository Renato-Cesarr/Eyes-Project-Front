<app-auth-layout>
  <app-form-card
    title="Acesso ao painel restrito"
    subtitle="Sua conta está segura, mas não possui permissão administrativa"
  >
    <eyes-feedback-banner
      tone="warning"
      title="Perfil sem permissão"
      [message]="
        'Olá, ' +
        userName() +
        '. Este painel é exclusivo para pessoas com o perfil Administrador. Nenhum dado foi alterado.'
      "
    />

    <div class="access-denied__actions">
      @if (isAuthenticated()) {
        <button type="button" class="auth-link-button" (click)="logout()">Sair desta conta</button>
      } @else {
        <a class="auth-link-button" routerLink="/login">Voltar para o login</a>
      }
    </div>
  </app-form-card>
</app-auth-layout>
