<app-auth-layout>
  <app-form-card title="Entrar no painel" subtitle="Use sua conta administrativa.">
    @if (sessionNotice(); as message) {
      <eyes-feedback-banner tone="info" title="Entre novamente" [message]="message" />
    }

    @if (authFacade.error(); as message) {
      <eyes-feedback-banner tone="error" title="Não foi possível entrar" [message]="message" />
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="public-form" novalidate>
      <div class="form-group" [class.invalid]="isFieldInvalid('email')">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="seu@email.com"
            autocomplete="email"
            inputmode="email"
            [attr.aria-invalid]="isFieldInvalid('email')"
            [attr.aria-describedby]="isFieldInvalid('email') ? 'login-email-error' : null"
          />
        </div>
        <small id="login-email-error" class="error-msg" *ngIf="isFieldInvalid('email')">
          Informe um e-mail válido.
        </small>
      </div>

      <div class="form-group" [class.invalid]="isFieldInvalid('password')">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [attr.aria-invalid]="isFieldInvalid('password')"
            [attr.aria-describedby]="isFieldInvalid('password') ? 'login-password-error' : null"
          />

          <button
            type="button"
            class="toggle-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="passwordVisible()"
            [attr.aria-label]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
          >
            <eyes-icon [name]="passwordVisible() ? 'visibility_off' : 'visibility'" />
          </button>
        </div>
        <small id="login-password-error" class="error-msg" *ngIf="isFieldInvalid('password')">
          Informe uma senha com pelo menos 6 caracteres.
        </small>
      </div>

      <a routerLink="/forgot-password" class="forgot-link">Esqueceu a senha?</a>

      <div class="form-actions">
        <app-button
          variant="primary"
          label="Entrar"
          type="submit"
          [fullWidth]="true"
          [loading]="authFacade.isLoading()"
          [disabled]="loginForm.invalid"
        />
      </div>

      <div class="footer-links">
        <span>Precisa de uma conta?</span>
        <a routerLink="/solicitar-acesso">Solicitar acesso</a>
      </div>
    </form>
  </app-form-card>
</app-auth-layout>
