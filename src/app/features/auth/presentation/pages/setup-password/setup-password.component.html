<app-auth-layout>
  <app-form-card title="Ativar conta" subtitle="Defina uma senha para sua conta.">
    <eyes-feedback-banner
      *ngIf="!tokenMissing() && errorMessage() as message"
      tone="error"
      title="Não foi possível ativar a conta"
      [message]="message"
    />

    <div
      *ngIf="isActivated(); else activationForm"
      class="completion-panel"
      role="status"
      aria-live="polite"
    >
      <h2>Conta ativada</h2>
      <p>Sua senha foi definida. Você já pode entrar.</p>
      <a class="auth-link-button" routerLink="/login">Ir para o login</a>
    </div>

    <ng-template #activationForm>
      <div
        *ngIf="tokenMissing(); else validTokenForm"
        class="recovery-panel"
        role="alert"
        aria-atomic="true"
      >
        <h2>Solicite um novo convite</h2>
        <p>{{ errorMessage() }}</p>
        <a class="auth-link-button auth-link-button--secondary" routerLink="/login">
          Voltar para o login
        </a>
      </div>
    </ng-template>

    <ng-template #validTokenForm>
      <form [formGroup]="setupForm" (ngSubmit)="onSubmit()" class="public-form" novalidate>
        <div class="form-group" [class.invalid]="isFieldInvalid('password')">
          <label for="password">Nova senha</label>
          <div class="input-wrapper password-input">
            <input
              id="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Mínimo de 6 caracteres"
              autocomplete="new-password"
              [attr.aria-invalid]="isFieldInvalid('password')"
              [attr.aria-describedby]="
                isFieldInvalid('password') ? 'password-help password-error' : 'password-help'
              "
            />
            <button
              type="button"
              class="toggle-btn"
              (click)="togglePasswordVisibility('password')"
              [attr.aria-pressed]="passwordVisible()"
              [attr.aria-label]="passwordVisible() ? 'Ocultar nova senha' : 'Mostrar nova senha'"
            >
              <eyes-icon [name]="passwordVisible() ? 'visibility_off' : 'visibility'" />
            </button>
          </div>
          <small id="password-help" class="field-help">Use pelo menos 6 caracteres.</small>
          <small id="password-error" class="error-msg" *ngIf="isFieldInvalid('password')">
            A senha deve ter pelo menos 6 caracteres.
          </small>
        </div>

        <div
          class="form-group"
          [class.invalid]="
            isFieldInvalid('confirmPassword') || setupForm.hasError('passwordMismatch')
          "
        >
          <label for="confirmPassword">Confirmar senha</label>
          <div class="input-wrapper password-input">
            <input
              id="confirmPassword"
              [type]="confirmPasswordVisible() ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="Digite a senha novamente"
              autocomplete="new-password"
              [attr.aria-invalid]="
                isFieldInvalid('confirmPassword') || setupForm.hasError('passwordMismatch')
              "
              [attr.aria-describedby]="
                isFieldInvalid('confirmPassword') || setupForm.hasError('passwordMismatch')
                  ? 'confirm-password-error'
                  : null
              "
            />
            <button
              type="button"
              class="toggle-btn"
              (click)="togglePasswordVisibility('confirmPassword')"
              [attr.aria-pressed]="confirmPasswordVisible()"
              [attr.aria-label]="
                confirmPasswordVisible()
                  ? 'Ocultar confirmação da senha'
                  : 'Mostrar confirmação da senha'
              "
            >
              <eyes-icon [name]="confirmPasswordVisible() ? 'visibility_off' : 'visibility'" />
            </button>
          </div>
          <small
            id="confirm-password-error"
            class="error-msg"
            *ngIf="isFieldInvalid('confirmPassword')"
          >
            Confirme a nova senha.
          </small>
          <small
            id="confirm-password-error"
            class="error-msg"
            *ngIf="!isFieldInvalid('confirmPassword') && setupForm.hasError('passwordMismatch')"
          >
            As senhas não coincidem.
          </small>
        </div>

        <div class="form-actions">
          <app-button
            variant="primary"
            label="Ativar conta"
            type="submit"
            [fullWidth]="true"
            [loading]="isLoading()"
            [disabled]="setupForm.invalid || isLoading()"
          />
        </div>
        <div class="footer-links">
          <a routerLink="/login">Voltar para o login</a>
        </div>
      </form>
    </ng-template>
  </app-form-card>
</app-auth-layout>
