<app-auth-layout>
  <app-form-card title="Definir Senha" subtitle="Crie uma senha segura para ativar sua conta">
    
    <form [formGroup]="setupForm" (ngSubmit)="onSubmit()" class="setup-form">
      
      <div class="form-group" [class.invalid]="isFieldInvalid('password')">
        <label for="password">Nova Senha</label>
        <div class="input-wrapper">
          <input 
            id="password" 
            [type]="passwordVisible() ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="Mínimo 6 caracteres"
            (focus)="setFocus('password')"
            (blur)="setFocus(null)">
          
          <button type="button" class="toggle-btn" (click)="togglePasswordVisibility('password')">
             {{ passwordVisible() ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <small class="error-msg" *ngIf="isFieldInvalid('password')">Senha deve ter no mínimo 6 caracteres</small>
      </div>

      <div class="form-group" [class.invalid]="isFieldInvalid('confirmPassword')">
        <label for="confirmPassword">Confirmar Senha</label>
        <div class="input-wrapper">
          <input 
            id="confirmPassword" 
            [type]="confirmPasswordVisible() ? 'text' : 'password'" 
            formControlName="confirmPassword" 
            placeholder="Repita a senha"
            (focus)="setFocus('confirmPassword')"
            (blur)="setFocus(null)">
          
          <button type="button" class="toggle-btn" (click)="togglePasswordVisibility('confirmPassword')">
             {{ confirmPasswordVisible() ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <small class="error-msg" *ngIf="setupForm.get('confirmPassword')?.hasError('mismatch')">As senhas não coincidem</small>
      </div>

      <app-button 
        variant="primary" 
        label="Ativar Conta" 
        type="submit"
        [loading]="isLoading()"
        [disabled]="setupForm.invalid">
      </app-button>

    </form>

  </app-form-card>
</app-auth-layout>
