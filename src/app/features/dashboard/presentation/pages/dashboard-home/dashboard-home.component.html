<div class="welcome-container">
  <div class="background-effects">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="glass-card fadeIn">
    <div class="card-content">
      <div class="header-section">
        <div class="time-capsule slide-down">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>{{ currentDateStr }}</span>
        </div>
        
        <div class="greeting-wrapper slide-right">
          <h1 class="gradient-text">{{ greeting }},</h1>
          <h2 class="admin-name">{{ adminName }}</h2>
        </div>
        
        <p class="subtitle slide-up">
          Seu painel de controle está pronto. Acesse o menu lateral para gerenciar solicitações, usuários e configurações visuais do sistema.
        </p>
      </div>

      <div class="actions slide-up-delayed">
        <button class="btn-primary ripple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span>Nova Solicitação</span>
        </button>
      </div>
    </div>
    
    <div class="illustration-section reveal">
      <div class="abstract-ring"></div>
      <div class="abstract-ring delayed"></div>
      
      <!-- Minimalist abstract eye logo for Eyes-project -->
      <svg class="hero-icon floating" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </div>
  </div>
</div>
