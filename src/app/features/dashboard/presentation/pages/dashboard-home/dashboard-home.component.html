<div class="dashboard-wrapper fadeIn">
  
  <header class="dashboard-header">
    <div class="welcome-text">
      <p class="subtitle">Bem-vindo(a) de volta,</p>
      <h1>{{ adminName }}</h1>
    </div>
    
    <div class="actions">
      <!-- Future buttons like New Request or Generate Report -->
      <button class="btn-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Gerar Relatório
      </button>
      <button class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Novo Usuário
      </button>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats" [class.warning-card]="stat.isWarning">
      <h3 class="stat-title">{{ stat.label }}</h3>
      <div class="stat-value-group">
        <span class="stat-value">{{ stat.value }}</span>
        
        <span class="stat-trend" 
          [class.positive]="stat.isPositive && !stat.isWarning" 
          [class.negative]="!stat.isPositive && !stat.isWarning"
          [class.warning]="stat.isWarning">
          <svg *ngIf="stat.isPositive && !stat.isWarning" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
          <svg *ngIf="!stat.isPositive && !stat.isWarning" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
            <polyline points="17 18 23 18 23 12"></polyline>
          </svg>
          <svg *ngIf="stat.isWarning" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ stat.trend }}
        </span>
      </div>
    </div>
  </div>

  <div class="main-widgets-grid">
    <div class="widget-card widget-large">
      <div class="widget-header">
        <h2>Atividades Recentes</h2>
        <a href="#" class="view-all">Ver tudo</a>
      </div>
      <div class="widget-body empty-state">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <p>Nenhuma atividade registrada no momento.</p>
        <span class="empty-subtext">Ações administrativas aparecerão aqui.</span>
      </div>
    </div>

    <div class="widget-card">
      <div class="widget-header">
        <h2>Acessos Rápidos</h2>
      </div>
      <div class="widget-body">
        <ul class="quick-links">
          <li>
            <div class="link-icon bg-blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
            <span>Gestão de Usuários</span>
          </li>
          <li>
            <div class="link-icon bg-indigo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
            <span>Políticas de Segurança</span>
          </li>
          <li>
            <div class="link-icon bg-cyan"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
            <span>Configurações Visuais</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
