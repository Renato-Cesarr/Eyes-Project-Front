<div class="enterprise-layout" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <!-- Sidebar Panel -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
        <span class="brand-text" *ngIf="!isSidebarCollapsed()">Eyes Project</span>
      </div>
      <!-- Toggle button for mobile/desktop -->
      <button
        class="toggle-btn"
        (click)="toggleSidebar()"
        [attr.aria-label]="isSidebarCollapsed() ? 'Expandir menu' : 'Recolher menu'"
      >
        <svg
          *ngIf="!isSidebarCollapsed()"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <svg
          *ngIf="isSidebarCollapsed()"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="sidebar-nav-container">
      <nav class="nav-menu">
        <ul>
          <li>
            <a routerLink="/dashboard" routerLinkActive="active">
              <div class="nav-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
              </div>
              <span class="nav-label" *ngIf="!isSidebarCollapsed()">Dashboard</span>
            </a>
          </li>
          <li>
            <a routerLink="/users" routerLinkActive="active">
              <div class="nav-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </div>
              <span class="nav-label" *ngIf="!isSidebarCollapsed()">Usuários</span>
            </a>
          </li>
          <li>
            <a routerLink="/requests" routerLinkActive="active">
              <div class="nav-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
              </div>
              <span class="nav-label" *ngIf="!isSidebarCollapsed()">Solicitações</span>
            </a>
          </li>
          <li>
            <a routerLink="/audit" routerLinkActive="active">
              <div class="nav-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M9 11l3 3L22 4"></path>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
              </div>
              <span class="nav-label" *ngIf="!isSidebarCollapsed()">Auditoria</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Main Content View -->
  <div class="main-content-area">
    <!-- Top Header -->
    <header class="top-header">
      <div class="header-left">
        <!-- Breadcrumb / Context Title -->
        <div class="context-crumbs">
          <span class="crumb">Sistema</span>
          <span class="separator">/</span>
          <span class="crumb current">Painel</span>
        </div>
      </div>

      <div class="header-right">
        <div class="user-dropdown">
          <div class="avatar" aria-hidden="true">
            <span>{{ userInitial() }}</span>
          </div>
          <div class="user-info">
            <span class="name">{{ currentUser()?.name }}</span>
            <span class="role">{{ roleLabel() }}</span>
          </div>
          <button
            class="icon-btn btn-logout"
            (click)="logout()"
            title="Sair do sistema"
            aria-label="Sair do sistema"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Scrollable Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
