<section class="form-card" [attr.aria-labelledby]="titleId">
  <header class="card-header">
    <h1 #titleElement [id]="titleId" class="card-title" tabindex="-1">{{ title() }}</h1>
    <p class="card-subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
  </header>

  <div class="card-content">
    <ng-content></ng-content>
  </div>
</section>
