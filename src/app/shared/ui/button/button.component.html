<button
  mat-flat-button
  [type]="type"
  class="eyes-button"
  [class.eyes-button--full-width]="fullWidth"
  [ngClass]="'eyes-button--' + variant"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading"
>
  <span *ngIf="!loading">{{ label }}</span>

  <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
  <span *ngIf="loading" class="eyes-visually-hidden" role="status"> {{ label }}: carregando… </span>
</button>
