<a class="skip-link" href="#auth-main">Pular para o conteúdo principal</a>

<div class="auth-shell">
  <header class="auth-toolbar">
    <a class="brand" routerLink="/login" aria-label="Eyes Project — ir para o login">
      <span class="brand__mark" aria-hidden="true">
        <eyes-icon name="visibility" />
      </span>
      <span>
        <strong>Eyes</strong>
        <small>Painel administrativo</small>
      </span>
    </a>

    <eyes-theme-switcher class="auth-theme" [showStatus]="false" [showLabel]="false" />
  </header>

  <div class="auth-layout">
    <aside class="auth-intro" aria-labelledby="auth-intro-title">
      <p class="auth-intro__eyebrow">Administração Eyes</p>
      <h2 id="auth-intro-title">Acessos organizados.<br />Decisões claras.</h2>
      <p>Analise solicitações, gerencie usuários e consulte o histórico de decisões.</p>
    </aside>

    <main id="auth-main" class="auth-content" tabindex="-1">
      <ng-content></ng-content>
    </main>
  </div>

  <footer class="auth-footer">
    <span>A assistência visual acontece no aplicativo mobile.</span>
  </footer>
</div>
