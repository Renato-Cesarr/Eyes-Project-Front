name: CI Front-End

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + Test + Sonar Front
    runs-on: ubuntu-latest

    steps:
      - name: Verificar origem da promoção para main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: test "$GITHUB_HEAD_REF" = dev && test "$HEAD_REPO" = "$GITHUB_REPOSITORY"

      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Validar toolchain
        shell: pwsh
        run: ./scripts/check-toolchain.ps1

      - name: Instalar dependências
        run: npm ci

      - name: Validar Design System
        run: npm run design-system:validate

      - name: Build Angular
        run: npm run build --if-present

      - name: Instalar Navegadores do Playwright
        run: npx --no-install playwright install chromium

      - name: Rodar testes
        run: npm run test:ci

      - name: Rodar fluxos E2E, regressão visual e acessibilidade
        run: npm run e2e

      - name: Guardar capturas de falhas visuais
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Validar cobertura LCOV nativa
        run: |
          test -s coverage/lcov.info
          grep -q "^SF:src/.*\.ts$" coverage/lcov.info

      - name: Rodar SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_WAIT: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: npm run sonar -- "-Dsonar.qualitygate.wait=$SONAR_WAIT"

  publish:
    name: Publicar painel no Google Cloud
    needs: build
    if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: eyes-web-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410a181273ba90b1 # v7.0.1
      - name: Construir imagem do painel
        env:
          API_ORIGIN: ${{ vars.GCP_API_ORIGIN }}
        run: docker build --platform linux/amd64 --build-arg API_ORIGIN --label "org.opencontainers.image.revision=$GITHUB_SHA" -t eyes-release .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '584.0.0'
      - name: Validar revisão antes de promover tráfego
        run: bash deploy/publish-cloud-run.sh eyes-web /login
