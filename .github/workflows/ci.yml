name: CI Front-End

on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]

jobs:
  build:
    name: Build + Test + Sonar Front
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Build Angular
        run: npm run build --if-present

      - name: Instalar Navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes
        run: npm run test:ci

      - name: Debug Coverage
        run: |
          ls -R coverage || echo "Coverage not found"
          [ -f coverage/lcov.info ] && head -n 20 coverage/lcov.info

      - name: Rodar SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npx sonar-scanner
