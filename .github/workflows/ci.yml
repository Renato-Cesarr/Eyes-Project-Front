name: CI Front-End

on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]

jobs:
  build:
    name: Build + Test + Sonar Front
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Validar toolchain
        shell: pwsh
        run: ./scripts/check-toolchain.ps1

      - name: Instalar dependências
        run: npm ci

      - name: Build Angular
        run: npm run build --if-present

      - name: Instalar Navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes
        run: npm run test:ci

      - name: De-bug Coverage
        run: |
          ls -R coverage || echo "Coverage not found"
          # Converte o JSON do Angular para LCOV para o Sonar entender
          npx nyc report --reporter=lcovonly --temp-dir=coverage/eyes-project-front --report-dir=coverage

      - name: Rodar SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npx sonar-scanner
